name: One-time repository migration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/migrate-repository.yml']
permissions:
  contents: read
jobs:
  migrate:
    if: github.repository == 'Yanwugirl/Universal-charger' && github.run_number == 1 && github.run_attempt == 1
    timeout-minutes: 5
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Import only into the verified initialization state
        env:
          SOURCE_COMMIT: fb03e8b9276627eb2b602e2f0cffbdf7d7e2529a
          SOURCE_TREE: ecbf98bf8d7dd5ad15538ff4ad0c7de2712e09f8
          INITIAL_COMMIT: 5fefe873991e33cae35aa0a7504375e875f6cffe
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$INITIAL_COMMIT"
          test "$(git ls-tree -r --name-only HEAD | LC_ALL=C sort)" = "$(printf '%s\n' '.github/workflows/migrate-repository.yml' 'README.md')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c http.https://github.com/.extraheader= fetch --no-tags --no-recurse-submodules https://github.com/Yanwugirl/creattech_websites-JiaMing.git "$SOURCE_COMMIT"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse "$SOURCE_COMMIT^{tree}")" = "$SOURCE_TREE"
          test "$(git ls-tree -r --name-only "$SOURCE_TREE" | wc -l | tr -d ' ')" = 111
          test -z "$(git ls-tree -r --name-only "$SOURCE_TREE" .github/workflows)"
          target_parent="$(git rev-parse HEAD)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$target_parent"
          migrated_commit="$(printf '%s\n' 'Import original project and history; remove one-time migration workflow' | git commit-tree "$SOURCE_TREE" -p "$target_parent" -p "$SOURCE_COMMIT")"
          git push origin "$migrated_commit:refs/heads/main"
